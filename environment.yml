# Development environment with OpenSim (optional: pystaple itself does not need it;
# it is used by the tests marked 'opensim' and by --backend opensim).
name: pystaple
channels:
  - opensim-org
  - conda-forge
dependencies:
  - python=3.11
  - opensim=4.6
  - numpy
  - scipy
  - pytest
  - pip
  - pip:
      - fast-simplification
      - -e .
