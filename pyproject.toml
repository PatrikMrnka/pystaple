[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pystaple"
dynamic = ["version"]
description = "Python port of the STAPLE toolbox (Modenese & Renault): automatic OpenSim models from bone geometries"
readme = "README.md"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
# decimation of the visualization meshes (MATLAB reducepatch)
viz = ["fast-simplification>=0.1.7"]
test = ["pytest>=7", "fast-simplification>=0.1.7"]
# NOTE: building OpenSim models also needs the `opensim` package, which is
# only distributed via conda: conda install -c opensim-org opensim

[project.scripts]
pystaple = "pystaple.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pystaple.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
