[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pystaple"
version = "0.1.0.dev0"
description = "Python port of the STAPLE toolbox (Modenese & Renault)"
readme = "README.md"
license = { text = "CC BY-NC 4.0" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
# decimation of the visualization meshes (MATLAB reducepatch)
viz = ["fast-simplification>=0.1.7"]
test = ["pytest>=7", "fast-simplification>=0.1.7"]
# NOTE: the OpenSim model layer also needs the `opensim` package, which is
# only distributed via conda: conda install -c opensim-org opensim

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
