name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  exe:
    needs: tests
    uses: ./.github/workflows/exe.yml

  release:
    needs: [tests, exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/pystaple/__init__.py').read_text()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ = $version"
            exit 1
          fi
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Reference data (meshes, MATLAB outputs and models, with their licenses)
        run: zip -r -q "dist/pystaple-${GITHUB_REF_NAME#v}-reference-data.zip" reference
      - uses: actions/download-artifact@v4
        with:
          name: pystaple-windows
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no section '## [${GITHUB_REF_NAME#v}]' in CHANGELOG.md"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
